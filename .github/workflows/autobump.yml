name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  workflow_dispatch:
  schedule:
    # Every day at 08:00 Asia/Shanghai (00:00 UTC).
    - cron: "0 0 * * *"

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    name: Bump ${{ matrix.type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: formulae
            os: ubuntu-latest
          - type: casks
            os: macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      # Bump PRs opened with `GITHUB_TOKEN` wait for manual CI approval; an
      # app token runs CI at once and shows the PRs as authored by the bot.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOBUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Bump ${{ matrix.type }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          BUMP_TYPE: ${{ matrix.type }}
        run: brew bump --"$BUMP_TYPE" --no-fork --open-pr --bump-synced --tap="$TAP_NAME"
