name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  workflow_dispatch:
  schedule:
    # Every day at 06:17 and 18:43 Asia/Shanghai (22:17 and 10:43 UTC).
    - cron: "17 22 * * *"
    - cron: "43 10 * * *"

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    name: Bump ${{ matrix.type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: formulae
            os: ubuntu-latest
          - type: casks
            os: macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      # Bump PRs opened with `GITHUB_TOKEN` wait for manual CI approval; an
      # app token runs CI at once and shows the PRs as authored by the bot.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOBUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Bump ${{ matrix.type }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          BUMP_TYPE: ${{ matrix.type }}
        run: brew bump --"$BUMP_TYPE" --no-fork --open-pr --bump-synced --tap="$TAP_NAME"
