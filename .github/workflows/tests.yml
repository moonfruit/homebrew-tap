name: brew test-bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*"
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-26, xcode-27]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # sing-tun registers a notifyd watcher for DNS configuration changes when
      # `sing-box run` starts and aborts with `status 9` when the macOS sandbox
      # denies its mach-lookup, which breaks the `sing-box-beta` test. Must run
      # after the cleanup step so it is not reverted by its `git clean`.
      - name: Allow notifyd in the macOS sandbox
        if: runner.os == 'macOS'
        run: |
          sandbox_rb="$(brew --repository)/Library/Homebrew/extend/os/mac/sandbox.rb"
          if grep -q '"com.apple.system.notification_center"' "${sandbox_rb}"; then
            echo "::notice::brew already allows notifyd in the sandbox; drop this step"
            exit 0
          fi
          awk '{ print } /\(allow mach-lookup$/ { match($0, /^ */); print substr($0, 1, RLENGTH) "    (global-name \"com.apple.system.notification_center\")" }' \
            "${sandbox_rb}" >"${sandbox_rb}.new"
          if ! grep -q '"com.apple.system.notification_center"' "${sandbox_rb}.new"; then
            echo "::error::Could not find where to add the notifyd rule in ${sandbox_rb}"
            exit 1
          fi
          mv "${sandbox_rb}.new" "${sandbox_rb}"

      # `brew test-bot` checks the linkage of a poured bottle, which does not
      # match how prebuilt formulae without bottles are installed, and ignores
      # failures of formulae without bottles for the current version.
      # Mirrors the changed-formulae detection in `test_bot/formulae_detect.rb`.
      - name: Detect changed formulae without bottles
        id: no-bottle
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cd "$(brew --repository)/Library/Taps/${GITHUB_REPOSITORY}"
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          formulae=""
          new=""
          bottled=false
          while read -r status file; do
            name="$(basename "$file" .rb)"
            if jq -e --arg name "$name" 'any(.[]; . == $name)' no_bottle_formulae.json &>/dev/null; then
              formulae="${formulae} ${name}"
              [[ "$status" == A ]] && new="${new} ${name}"
            else
              bottled=true
            fi
          done < <(git diff-tree -r --name-status --diff-filter=AM "$base" HEAD -- 'Formula/*.rb')

          if [[ "$bottled" == true && -n "$formulae" ]]; then
            echo "::error::Do not mix formulae with and without bottles in one pull request."
            exit 1
          fi
          echo "formulae=${formulae# }" >>"$GITHUB_OUTPUT"
          echo "new=${new# }" >>"$GITHUB_OUTPUT"

      - name: Test formulae without bottles
        if: steps.no-bottle.outputs.formulae != ''
        env:
          FORMULAE: ${{ steps.no-bottle.outputs.formulae }}
          NEW: ${{ steps.no-bottle.outputs.new }}
        run: |
          for formula in $FORMULAE; do
            # Mirrors `audit_args` in `test_bot/formulae.rb`: tap syntax already ran `brew style`,
            # but `--new` also runs the `FormulaAuditStrict` cops that it excludes.
            if [[ " ${NEW} " == *" ${formula} "* ]]; then
              brew audit --formula --online --new "${GITHUB_REPOSITORY}/${formula}"
            else
              brew audit --formula --online --git --skip-style "${GITHUB_REPOSITORY}/${formula}"
            fi
            brew install --include-test "${GITHUB_REPOSITORY}/${formula}"
            brew test --verbose "${GITHUB_REPOSITORY}/${formula}"
          done

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - run: brew test-bot --only-formulae --only-json-tab --root-url=https://ghcr.io/v2/moonfruit/bottle
        if: github.event_name == 'pull_request' && steps.no-bottle.outputs.formulae == ''
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
