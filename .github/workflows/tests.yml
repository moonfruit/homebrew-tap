name: brew test-bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*"
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-26, xcode-27]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # sing-tun registers a notifyd watcher for DNS configuration changes when
      # `sing-box run` starts and aborts with `status 9` when the macOS sandbox
      # denies its mach-lookup, which breaks the `sing-box-beta` test. Must run
      # after the cleanup step so it is not reverted by its `git clean`.
      - name: Allow notifyd in the macOS sandbox
        if: runner.os == 'macOS'
        run: |
          sandbox_rb="$(brew --repository)/Library/Homebrew/extend/os/mac/sandbox.rb"
          if grep -q '"com.apple.system.notification_center"' "${sandbox_rb}"; then
            echo "::notice::brew already allows notifyd in the sandbox; drop this step"
            exit 0
          fi
          awk '{ print } /\(allow mach-lookup$/ { match($0, /^ */); print substr($0, 1, RLENGTH) "    (global-name \"com.apple.system.notification_center\")" }' \
            "${sandbox_rb}" >"${sandbox_rb}.new"
          if ! grep -q '"com.apple.system.notification_center"' "${sandbox_rb}.new"; then
            echo "::error::Could not find where to add the notifyd rule in ${sandbox_rb}"
            exit 1
          fi
          mv "${sandbox_rb}.new" "${sandbox_rb}"

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - run: brew test-bot --only-formulae --only-json-tab --root-url=https://ghcr.io/v2/moonfruit/bottle
        if: github.event_name == 'pull_request'
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
